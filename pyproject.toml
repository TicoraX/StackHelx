[project]
name = "stackhelx"
# Una sola fuente: `stackhelx/__init__.py`. Con el numero escrito en los dos
# lados, un release publica el de aca y `stackhelx --version` muestra el otro
# en cuanto alguien se olvide de sincronizarlos.
dynamic = ["version"]
description = "Orquestador de entornos de desarrollo locales: puertos, Docker, backend y frontend con un solo comando"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "TicoraX" }]
keywords = ["cli", "devtools", "ports", "docker", "orchestration", "dx", "stackhelx"]
classifiers = [
    # PyPI arma su navegacion por categorias con estos campos: sin ellos el
    # paquete solo aparece por busqueda exacta del nombre.
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    # La CI prueba el piso (3.10) y el techo (3.13) del rango, y no hay codigo
    # condicionado por version de interprete. Si alguna vez aparece un
    # sys.version_info, hay que agregar 3.11 y 3.12 a la matriz.
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "psutil>=6.0",
    "pyyaml>=6.0",
    "tomli>=2.0; python_version < '3.11'",
    # La interfaz web no es un extra. Con `pipx` o `uv tool`, que son los dos
    # metodos que documenta el README, `pip install 'stackhelx[web]'` instala
    # en el interprete del PATH y no en el venv aislado de la herramienta: el
    # usuario queda en un bucle donde el mensaje de error sugiere un comando
    # que no arregla nada. Son 15 MB en algo que ya trae psutil y rich.
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# pytest-xdist no es un lujo: la suite arranca procesos y espera
# healthchecks, o sea que casi todo su tiempo es espera y no CPU. En
# paralelo baja de 6m30s a poco mas de un minuto. La reserva de puertos de
# `tests/conftest.py` reparte una franja por worker para que eso sea seguro.
dev = ["pytest>=8", "pytest-xdist>=3", "httpx>=0.27", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/TicoraX/StackHelx"
Repository = "https://github.com/TicoraX/StackHelx"
Issues = "https://github.com/TicoraX/StackHelx/issues"

[project.scripts]
stackhelx = "stackhelx.cli:app"
shx = "stackhelx.cli:app"

[tool.ruff.lint]
# El default de ruff (E4, E7, E9, F) mas orden de imports. Lo que interesa es F:
# nombre indefinido, import sin usar, variable perdida. Un bloque de codigo que
# se cae en un merge sale ahi y no lo ve ningun test.
#
# Fuera quedan E501, B904 y el resto del catalogo de estilo: sumaban 32 hallazgos
# en codigo que funciona, y adoptarlos obligaba a un commit de reformateo que
# nadie pidio.
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "stackhelx/__init__.py"

[tool.hatch.build.targets.wheel]
# `packages` ya se lleva stackhelx/web entero, HTML, CSS y JS incluidos. El
# force-include que habia aca los agregaba una segunda vez y el build moria con
# "a second file is being added at the same path". Nunca se noto porque nadie
# habia empacado la herramienta todavia: se instalaba con `pip install -e`.
packages = ["stackhelx"]
