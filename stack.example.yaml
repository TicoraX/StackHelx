# StackHelx configuration schema.
#
# This file is optional: without one, StackHelx auto-detects project services.
# `stackhelx init` (or `shx init`) writes the detected config here for manual editing.

name: my-project

# includes:              # import services from other projects or subdirectories
#   - ../shared-backend
#   - ./services/auth

services:
  db:
    command: docker compose up -d postgres
    port: 5432
    ready: port        # port | listen | log:<text> | http://... | none
    detached: true     # command exits while the container stays alive
    stop: docker compose stop postgres

  api:
    command: npm run dev
    cwd: backend       # relative to project root, cannot escape outside it
    port: 8080
    needs: [db]
    env_file: [.env, .env.local]  # .env file or list of files to load (inside root)
    pre_start: npm run build      # synchronous command before starting the service
    post_start: npm run seed      # synchronous command after passing healthcheck
    url: http://localhost:8080/docs   # target for "Open" button. Supports ${VAR}
    restart: on-failure  # no | on-failure | always. Active while logs are followed
    max_retries: 3       # maximum restart attempts. Counter does not reset on its own
    env:
      DATABASE_URL: postgres://localhost:5432/app

  web:
    command: npm run dev
    cwd: frontend
    ready: listen      # process picks its own port, discovered at startup
    needs: [api]       # no `url:` on purpose: see rules below

profiles:
  fullstack: [db, api, web]
  backend: [db, api]
  db-only: [db]

scripts:
  test: pytest tests/ -v
  lint: ruff check .
  check: [lint, test]           # sequential task pipeline
  migrate: npm run db:migrate

# Rules:
#
# - Only `command` is required.
# - `needs` defines startup order. Independent services start in parallel within
#   the same wave, and each wave waits until all its services are ready before
#   the next wave starts: total startup time equals the slowest healthcheck per
#   wave, not the sum of all services. Dependency cycles fail immediately when
#   loading the file.
# - `ready: port` waits until the TCP port accepts connections. Default when
#   `port` is set; without `port`, the default is `none`.
# - `ready: listen` waits until the process tree opens any TCP port and reports
#   which port it bound. Incompatible with `port`.
# - `stop` is the custom shutdown command. Without it, StackHelx terminates the
#   process tree, which is not enough for detached containers that live outside
#   that tree.
# - `url` sets the target for the "Open" button and `stackhelx open` when the
#   port root is not the entry point (e.g. mounted under /admin or requiring a
#   query token). Defaults to `http://localhost:<port>`. Only http and https are
#   allowed. Supports `${VAR}` and `${VAR:-default}` resolved against the
#   service environment (`env`, `env_file`, `env.global`, and shell env). An
#   unset variable without a default leaves the service with no URL rather than
#   opening a broken literal `${VAR}` string.
# - `url` and `ready: listen` cannot be combined. A `listen` service picks its
#   port dynamically, so any hardcoded port in `url` is a guess that overrides
#   the discovered port. That is why `web` above omits `url`.
# - `env_file` paths are relative to the project root and cannot escape it:
#   `../../.env` raises an error when loading the file.
# - Without `--profile`, all services start (unless `default` is defined).
