# Esquema de configuracion de StackHelx.
#
# El archivo es opcional: sin uno, StackHelx detecta los servicios del proyecto.
# `stackhelx init` (o `shx init`) escribe lo detectado aca para editarlo a mano.

name: mi-proyecto

# includes:              # importa servicios de otros proyectos o sub-carpetas
#   - ../shared-backend
#   - ./services/auth

services:
  db:
    command: docker compose up -d postgres
    port: 5432
    ready: port        # port | listen | log:<texto> | http://... | none
    detached: true     # el comando termina, el servicio sigue vivo
    stop: docker compose stop postgres

  api:
    command: npm run dev
    cwd: backend       # relativo a la raiz, no puede escapar de ella
    port: 8080
    needs: [db]
    env_file: [.env, .env.local]  # archivo o lista de archivos .env a cargar, dentro de la raiz
    pre_start: npm run build      # comando síncrono previo al arranque
    post_start: npm run seed      # comando síncrono posterior a la confirmación de salud
    url: http://localhost:8080/docs   # adonde lleva "Abrir". Admite ${VAR}
    restart: on-failure  # no | on-failure | always. Solo mientras se siguen los logs
    max_retries: 3       # tope de reintentos. La cuenta no se reinicia sola
    env:
      DATABASE_URL: postgres://localhost:5432/app

  web:
    command: npm run dev
    cwd: frontend
    ready: listen      # el puerto lo elige el, se descubre al arrancar
    needs: [api]       # sin `url:` a proposito: ver la nota de abajo

profiles:
  fullstack: [db, api, web]
  backend: [db, api]
  db-only: [db]

scripts:
  test: pytest tests/ -v
  lint: ruff check .
  check: [lint, test]           # pipeline secuencial de tareas
  migrate: npm run db:migrate

# Reglas:
#
# - Solo `command` es obligatorio.
# - `needs` define el orden. Los servicios que no dependen entre si arrancan
#   juntos, y cada tanda espera a estar lista antes de la siguiente: el stack
#   tarda el healthcheck mas lento de cada nivel, no la suma de todos. Los
#   ciclos son error al cargar el archivo, no en tiempo de ejecucion.
# - `ready: port` espera a que el TCP acepte conexion. Es el default cuando hay
#   `port`; sin `port`, el default es `none`.
# - `ready: listen` espera a que el proceso abra cualquier puerto, y reporta cual.
#   Es incompatible con `port`.
# - `stop` es el apagado del servicio. Sin el, se mata el arbol de procesos, que
#   no alcanza para un contenedor: vive fuera de ese arbol.
# - `url` es adonde lleva el boton "Abrir", para cuando la raiz del puerto no es
#   la entrada: una app montada en /admin, o una que pide un token en la query.
#   Sin `url`, es `http://localhost:<port>`. Solo http y https. Admite `${VAR}` y
#   `${VAR:-default}`, resueltos con el mismo entorno con el que corre el
#   servicio (`env`, `env_file`, y el del shell). Una variable sin valor deja el
#   servicio sin URL en vez de abrir una con el `${VAR}` literal adentro.
# - `url` y `ready: listen` no se combinan. El puerto de un servicio `listen` lo
#   elige el proceso, asi que cualquier puerto escrito en la URL es una apuesta,
#   y `url` le gana al puerto descubierto: escribirla empeora el boton en vez de
#   mejorarlo. Por eso `web` de arriba no la declara.
# - `env_file` van relativos a la raiz del proyecto y no pueden salir de ella:
#   `../../.env` es error al cargar el archivo.
# - Sin `--profile`, arrancan todos los servicios.
